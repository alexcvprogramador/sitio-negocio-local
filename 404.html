<!doctype html>
<html lang="es-CL">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Esta página no ejecuta ningún programa. Las rutas empiezan con "/" porque GitHub Pages
     la muestra desde cualquier dirección. Si el sitio queda en una subcarpeta
     (usuario.github.io/nombre-del-repositorio), cambia "/assets" por "/nombre-del-repositorio/assets". -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Página no encontrada</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/estilo.css">
</head>
<body>
<main class="error">
  <h1>No encontramos esa página</h1>
  <p>Puede que la dirección esté mal escrita o que la página ya no exista.</p>
  <a class="boton boton--acento boton--grande" href="/">Volver al inicio</a>
</main>
</body>
</html>
